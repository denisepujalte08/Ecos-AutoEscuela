<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#fffaf5;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;">
      <h1 style="margin:0 0 12px;font-size:22px;">Entrá a tu cuenta de ECOS</h1>
      <p style="margin:0 0 12px;line-height:1.5;">
        Tocá el botón para entrar. El link funciona una sola vez y vence en una hora.
      </p>
      <p style="margin:24px 0;">
        <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email"
           style="background:#f08a3e;color:#141414;text-decoration:none;font-weight:bold;padding:12px 24px;border-radius:999px;display:inline-block;">
          Entrar a mi cuenta
        </a>
      </p>
      <p style="margin:0;color:#6b6560;font-size:13px;line-height:1.5;">
        Si no lo pediste vos, podés ignorar este mail: nadie puede entrar sin este link.
      </p>
    </div>
  </body>
</html>
