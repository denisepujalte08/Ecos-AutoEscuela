version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 todavía no lo soporta typescript-eslint (el lint falla).
      # Reevaluar cuando typescript-eslint lo soporte.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Los tipos deben coincidir con la versión de Node que usamos (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
